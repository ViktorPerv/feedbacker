server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Docker's embedded DNS. Referencing it explicitly is what lets the
        # upstream below be re-resolved.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;

        # A literal `fastcgi_pass app:9000` is resolved once, when nginx
        # starts, and cached for the life of the process. Recreating the app
        # container hands it a new IP, so nginx keeps dialling a dead address
        # and every request becomes a 502 until nginx itself restarts.
        #
        # Putting the host in a variable forces resolution through the
        # resolver above on each re-resolve window, so `docker compose up -d
        # app` no longer requires a matching nginx restart.
        set $upstream_app app;

        fastcgi_pass $upstream_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
